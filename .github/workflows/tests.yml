name: CPU and shell regression tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q --ignore=tests/test_gpu.py
      - run: python -m compileall -q benchmark_w8a8_block_fp8.py fp8_tuning.py benchmark_w8a8_block_fp8_qwencoder.py tests
      - run: |
          for file in scripts/*.sh examples/*.sh; do
            bash -n "$file" || exit 1
          done
